name: 'Docker Build and Push'
description: 'Sets up Docker Buildx, logs in to GHCR, and builds/pushes image'
inputs:
  registry:
    description: 'Docker registry'
    required: false
    default: 'ghcr.io'
  image-name:
    description: 'Full image name (including owner)'
    required: true
  use-npm:
    description: 'Use npm registry for private packages'
    required: false
    default: 'false'
  use-nuget:
    description: 'Use NuGet registry for private packages'
    required: false
    default: 'false'
  nuget-source:
    description: 'NuGet source URL'
    required: false
    default: 'https://nuget.pkg.github.com/graduatecollege/index.json'
  tag:
    description: 'Custom tag to apply to the image (overrides auto-generated tags)'
    required: false
    default: ''
  local:
    description: 'Build locally only — skips registry login and does not push the image'
    required: false
    default: 'false'
  build-args:
    description: 'Additional build arguments to pass to Docker'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # ratchet:docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      if: ${{ inputs.local != 'true' }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # ratchet:docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # ratchet:docker/metadata-action@v6
      with:
        images: ${{ inputs.local == 'true' && inputs.image-name || format('{0}/{1}', inputs.registry, inputs.image-name) }}
        tags: |
          ${{ inputs.tag != '' && format('type=raw,value={0}', inputs.tag) || 'type=semver,pattern={{version}}' }}
          ${{ inputs.tag == '' && 'type=semver,pattern={{major}}.{{minor}}' || '' }}
          ${{ inputs.tag == '' && 'type=semver,pattern={{major}}' || '' }}
          ${{ inputs.tag == '' && 'type=sha' || '' }}

    - name: Create temporary .npmrc
      if: ${{ inputs.use-npm == 'true' }}
      shell: bash
      run: |
        echo "@graduatecollege:registry=https://npm.pkg.github.com/" > .npmrc_tmp
        echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc_tmp

    - name: Build and push Docker image
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # ratchet:docker/build-push-action@v7
      with:
        context: .
        push: ${{ inputs.local != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          ${{ inputs.use-nuget == 'true' && format('NUGET_URL={0}', inputs.nuget-source) || '' }}
          ${{ inputs.build-args }}
        secrets: |
          ${{ inputs.use-nuget == 'true' && format('"nuget=Username={0};Password={1}"', github.actor, github.token) || '' }}
        secret-files: |
          ${{ inputs.use-npm == 'true' && 'npmrc=.npmrc_tmp' || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: ${{ inputs.local == 'true' }}

    - name: Cleanup temporary .npmrc
      if: ${{ always() && inputs.use-npm == 'true' }}
      shell: bash
      run: rm -f .npmrc_tmp
